version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ap_intake
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"  # Different port to avoid conflicts
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible storage
  minio:
    image: minio/minio:latest
    ports:
      - "9004:9000"  # Different port to avoid conflicts
      - "9005:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - ap_intake_api_test:latest
    ports:
      - "8001:8000"  # Different port to avoid conflicts
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ap_intake
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=s3
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - AWS_REGION=us-east-1
      - S3_BUCKET_NAME=ap-intake-documents
      - S3_ENDPOINT_URL=http://minio:9000
      - DEBUG=true
      - LOG_LEVEL=INFO
      - EMAIL_INGESTION_ENABLED=true
      - EMAIL_AUTO_PROCESS_INVOICES=true
      - DOCLING_CONFIDENCE_THRESHOLD=0.85
      - LLM_PROVIDER=openrouter
      - LLM_MODEL=z-ai/glm-4.5-air:free
      - OPENROUTER_API_KEY=your-openrouter-key-here
      - SECRET_KEY=your-super-secret-key-here-change-in-production
      - USE_SWAPPABLE_INTEGRATION=true
      - INTEGRATION_DEFAULT_PROVIDER=native
    volumes:
      - ./storage:/app/storage
      - ./exports:/app/exports
      - ./langgraph_storage:/app/langgraph_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - ap_intake_worker_test:latest
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ap_intake
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=s3
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - AWS_REGION=us-east-1
      - S3_BUCKET_NAME=ap-intake-documents
      - S3_ENDPOINT_URL=http://minio:9000
      - DEBUG=true
      - LOG_LEVEL=INFO
      - DOCLING_CONFIDENCE_THRESHOLD=0.85
      - LLM_PROVIDER=openrouter
      - LLM_MODEL=z-ai/glm-4.5-air:free
      - OPENROUTER_API_KEY=your-openrouter-key-here
      - SECRET_KEY=your-super-secret-key-here-change-in-production
    volumes:
      - ./storage:/app/storage
      - ./exports:/app/exports
      - ./langgraph_storage:/app/langgraph_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Web UI (React app development server)
  web:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "3001:3000"  # Different port to avoid conflicts
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm start"
    environment:
      - REACT_APP_API_URL=http://localhost:8001
      - NEXT_PUBLIC_API_URL=http://localhost:8001

volumes:
  postgres_data:
  redis_data:
  minio_data:
  web_node_modules: