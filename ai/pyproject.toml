[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoicify-ai"
version = "0.1.0"
description = "AI service for invoice extraction and processing"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Invoicify Team"}]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-ai>=0.0.49",
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "pillow>=10.0.0",
    "docling>=2.0.0",
    "pandas>=2.0.0",
    # Vector search & embeddings
    "fastembed>=0.5.0",
    "qdrant-client>=1.12.0",
    # Observability
    "langfuse>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
