[tool.poetry]
name = "python-worker"
version = "0.1.0"
description = "Temporal Python worker for invoice processing with Docling document understanding"
authors = ["Nivi AI <team@nivi.ai>"]
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.poetry.dependencies]
python = "^3.11"
temporalio = "^1.20.0"
aiokafka = "^0.10.0"
river = "^0.21.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.0.0"
httpx = "^0.28.0"
python-dotenv = "^1.0.0"
structlog = "^24.0.0"
boto3 = "^1.35.0"
docling = "^2.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.0.0"
ruff = "^0.1.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
