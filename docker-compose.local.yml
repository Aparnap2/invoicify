# Docker Compose - Local Azure Emulators ONLY
# Run with: docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# IMPORTANT: Does NOT recreate ollama (preserves your existing models)
# Uses your existing Ollama container at localhost:11434
#
# Emulates:
# - Azure Blob Storage (Azurite)
# - Azure SQL Database (SQL Server Express)
# - Azure Cosmos DB (Emulator)
# - Mockoon (Event Grid, QuickBooks, Twilio mocks)

services:
  # ───────────────────────────────────────────────────────────────────────────
  # Azurite - Azure Blob/Queue/Table Storage emulator
  # ───────────────────────────────────────────────────────────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: invoicify-azurite
    ports:
      - "10000:10000"  # Blob
      - "10001:10001"  # Queue
      - "10002:10002"  # Table
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --loose
    volumes:
      - azurite_data:/data
    networks:
      - invoicify
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10000"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ───────────────────────────────────────────────────────────────────────────
  # Azure SQL (SQL Server Express - free, full SQL Server)
  # ───────────────────────────────────────────────────────────────────────────
  azure-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: invoicify-azure-sql
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Invoicify@Local123
      - MSSQL_PID=Express
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - invoicify
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost",
             "-U", "sa", "-P", "Invoicify@Local123", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ───────────────────────────────────────────────────────────────────────────
  # Cosmos DB Emulator
  # ───────────────────────────────────────────────────────────────────────────
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: invoicify-cosmos
    ports:
      - "8081:8081"    # Data Explorer UI: https://localhost:8081/_explorer
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=3
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
    volumes:
      - cosmos_data:/tmp/cosmos/appdata
    networks:
      - invoicify
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8081/_explorer/emulator.pem"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ───────────────────────────────────────────────────────────────────────────
  # Mockoon - mocks Event Grid, QuickBooks, Twilio
  # ───────────────────────────────────────────────────────────────────────────
  mockoon:
    image: mockoon/cli:latest
    container_name: invoicify-mockoon
    ports:
      - "3001:3001"    # Event Grid mock
      - "3002:3002"    # QuickBooks mock
      - "3003:3003"    # Twilio mock
    volumes:
      - ./mocks:/data
    command: >
      --data /data/event-grid.json
      --data /data/quickbooks.json
      --data /data/twilio.json
      --port 3001
    networks:
      - invoicify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  azurite_data:
  sql_data:
  cosmos_data:

networks:
  invoicify:
    external: true
